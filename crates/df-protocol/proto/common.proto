syntax = "proto3";
package dungeonflux.public.v1;
// Supplied identity only: not authentication, authorization, or issuance.
message SessionId { optional bytes value = 1; }
message MemberId { optional bytes value = 1; }
message ClientBindingId { optional bytes value = 1; }
message RunId { optional bytes value = 1; }
message OperationId { optional bytes value = 1; }
// Required application presence; zero epoch is invalid. Issuance is outside this schema.
message RecoveryEpoch { optional uint64 value = 1; }
message SessionRevision {
  RecoveryEpoch epoch = 1;
  // Dimensionless in-epoch sequence; explicit zero is valid, absence is invalid.
  optional uint64 sequence = 2;
}
// All five nonsecret revision labels are required at the consuming boundary.
message BuildIdentity {
  optional string source_revision = 1;
  optional string native_revision = 2;
  optional string wasm_revision = 3;
  optional string configuration_revision = 4;
  optional string content_revision = 5;
}
