[package]
name = "df-audio"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
df-assets = { path = "../df-assets" }
df-types = { path = "../df-types" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
df-media = { path = "../df-media" }
df-model = { path = "../df-model" }

[dev-dependencies]
df-client = { path = "../df-client" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = ["AudioContext", "AudioContextState", "BaseAudioContext", "AudioBuffer", "AudioBufferSourceNode", "AudioScheduledSourceNode", "AudioNode", "AudioDestinationNode", "Event"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
web-sys = { workspace = true, features = ["Window", "Document", "Element", "HtmlElement", "EventTarget", "Node", "Event"] }

[[example]]
name = "browser_playback_fixture"
path = "tests/fixtures/browser_playback_fixture.rs"
crate-type = ["cdylib"]
