[package]
name = "df-tools"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "df-transport-fixture"
path = "src/main.rs"

[dependencies]
web-time = "=1.1.0"
df-protocol = { path = "../df-protocol" }
df-rpc-bridge = { path = "../df-rpc-bridge" }
df-observe = { path = "../df-observe" }
bytes.workspace = true
futures.workspace = true
tonic.workspace = true
tokio.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
axum = { version = "0.8", features = ["ws"] }
tonic = { workspace = true, features = ["transport", "router"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "time", "signal"] }
tokio-stream = "0.1"
tower-http = { version = "0.6", features = ["fs"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "=0.3.106"
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
gloo-timers = { version = "0.3", features = ["futures"] }
web-sys = { workspace = true, features = ["Window", "Document", "Element", "HtmlElement", "HtmlButtonElement", "Event", "Location", "Performance", "Navigator", "Request", "RequestInit", "Response"] }

[dev-dependencies]
df-types = { path = "../df-types" }
prost.workspace = true
prost-types = "0.14"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio-tungstenite = "0.29"
