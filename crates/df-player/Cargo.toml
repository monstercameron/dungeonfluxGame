[package]
name = "df-player"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
df-client = { path = "../df-client" }
df-types = { path = "../df-types" }
df-ui = { path = "../df-ui" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
web-sys = { workspace = true, features = ["Window", "Document", "Element", "Node", "HtmlElement", "HtmlFieldSetElement", "HtmlButtonElement"] }
[dev-dependencies]
df-display = { path = "../df-display" }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
web-sys = { workspace = true, features = ["Event", "EventTarget", "HtmlInputElement"] }

[[example]]
name = "dual_character_clients_fixture"
path = "tests/fixtures/dual_character_clients_fixture.rs"
crate-type = ["cdylib"]

[[example]]
name = "player_sheet_clients_fixture"
path = "tests/fixtures/player_sheet_clients_fixture.rs"
crate-type = ["cdylib"]

[[example]]
name = "dual_exploration_mount_fixture"
path = "tests/fixtures/dual_exploration_mount_fixture.rs"
crate-type = ["cdylib"]
