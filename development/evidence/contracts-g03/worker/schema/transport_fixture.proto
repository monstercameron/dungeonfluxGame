syntax = "proto3";
package dungeonflux.experimental.transport.v1;
// Frozen S00 experiment only. No production game API is declared here.
service TransportFixture {
  rpc Unary(Sample) returns (Sample);
  rpc ServerStream(Sample) returns (stream Sample);
  rpc ClientStream(stream Sample) returns (Sample);
  rpc Bidi(stream Sample) returns (stream Sample);
}
message Sample {
  uint32 sequence = 1;
  bytes payload = 2;
  enum Behavior {
    BEHAVIOR_UNSPECIFIED = 0;
    ECHO = 1;
    REJECT = 2;
    WAIT = 3;
  }
  Behavior behavior = 3;
  // Fixture diagnostics only; never gameplay authority.
  uint32 active_calls = 4;
  uint32 deadline_calls = 5;
}
